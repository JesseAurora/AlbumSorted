name: PhotoCleaner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photocleaner
        PRODUCT_NAME: PhotoCleaner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Cleaner
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Cleaner reads your library on this iPhone to sort items by storage used and to delete the ones you pick. Nothing leaves your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
